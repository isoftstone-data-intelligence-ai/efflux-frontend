apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: SERVICE
  template:
    metadata:
      labels:
        app: SERVICE
    spec:
      containers:
      - name: SERVICE-c
        image: IMAGE
        ports:
        - containerPort: 80
        imagePullPolicy: Always
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:   
            memory: "1024Mi"
            cpu: "500m"            
        livenessProbe:
          httpGet:
            path: /api/healthCheck
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /api/healthCheck
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c 
              - "sleep 5"
---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE
  labels:
    app: SERVICE
spec:
  ports:
    - name: http
      protocol: TCP
      port: 30100
      targetPort: 3000
  selector:
    app: SERVICE
  type: ClusterIP
  sessionAffinity: None
